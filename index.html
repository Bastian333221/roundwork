<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eeeee6">
  <meta name="description" content="Your equipment-aware boxing training companion. Purposeful power, strength, conditioning, and visual exercise guides.">
  <title>ROUNDWORK — Your boxing companion</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Roundwork">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="#session" aria-label="Roundwork home"><span class="brand-mark" aria-hidden="true">R<span>↗</span></span><span>ROUNDWORK<small>BUILT BETWEEN ROUNDS</small></span></a>
      <div class="header-note"><span class="status-dot"></span> YOUR TRAINING, IN YOUR CORNER</div>
      <button class="icon-button" id="help-button" aria-label="About this training plan">?</button>
    </header>
    <nav class="main-nav" aria-label="Main navigation">
      <button data-tab="session" class="nav-button active" aria-current="page"><span class="nav-symbol" aria-hidden="true">↗</span> Session</button>
      <button data-tab="plan" class="nav-button"><span class="nav-symbol" aria-hidden="true">▦</span> The plan</button>
      <button data-tab="exercises" class="nav-button"><span class="nav-symbol" aria-hidden="true">◫</span> Exercises</button>
      <button data-tab="gym" class="nav-button"><span class="nav-symbol" aria-hidden="true">⌘</span> My gym <span id="gym-count" class="nav-badge"></span></button>
    </nav>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer"><span>ROUNDWORK <span class="footer-cross">×</span> QUALITY OVER EXHAUSTION</span><span id="save-status">Preferences & logs stay on this device.</span></footer>
  </div>
  <aside id="timer-dock" class="timer-dock" aria-label="Training timer" hidden>
    <div class="timer-info"><span id="timer-label">REST TIMER</span><strong id="timer-display" role="timer" aria-live="off">01:00</strong></div>
    <button id="timer-toggle" class="button button-primary">Start</button>
    <button id="timer-reset" class="icon-button" aria-label="Reset timer">↺</button>
    <button id="timer-close" class="icon-button" aria-label="Close timer">×</button>
  </aside>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="diagrams.js"></script>
  <script src="app.js"></script>
  <script src="mobile.js"></script>
</body>
</html>
